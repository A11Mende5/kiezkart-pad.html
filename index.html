<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0910"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Kiezkart Controller</title>
<style>
:root{--bg:#0b0910;--fg:#ece8f0;--dim:#8d879a;--line:#3a3445;--pc:#ff4fd0;--acc2:#3ad9ff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
#join{height:100%;display:grid;place-content:center;gap:14px;padding:20px;max-width:420px;margin:0 auto;touch-action:auto}
#join *{touch-action:auto;-webkit-user-select:text;user-select:text}
h1{margin:0;font-size:40px;letter-spacing:-.04em;font-weight:900}h1 span{color:var(--pc)}
label{font-size:12px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#16131c;color:var(--fg)}
#go{font:inherit;font-weight:800;font-size:20px;padding:16px;border-radius:12px;border:0;background:var(--pc);color:#140c14}
#msg{color:var(--dim);font-size:14px;min-height:1.3em}
#pad{position:fixed;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:10px}
.bar{grid-column:1/3;display:flex;gap:10px;align-items:center;font-size:14px}
.bar b{color:var(--pc)}.bar .sp{flex:1}
.bar button{font:inherit;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#16131c;color:var(--fg)}
#status{color:var(--dim)}#place{font-weight:900;font-size:22px;color:var(--pc)}#lap{color:var(--dim)}
.left,.right{position:relative;display:grid;gap:10px}
.left{grid-template-columns:1fr 1fr}
.btn{border-radius:22px;border:2px solid var(--line);background:#16131c;display:grid;place-content:center;font-weight:900;font-size:26px;letter-spacing:.04em;color:var(--fg);transition:background .05s,transform .05s}
.btn small{display:block;font-size:12px;font-weight:600;color:var(--dim);text-align:center;letter-spacing:.1em}
.btn.on{background:var(--pc);color:#140c14;transform:scale(.97)}.btn.on small{color:#140c14}
#btnL,#btnR{font-size:54px}
body[data-mode=tilt] #btnL,body[data-mode=tilt] #btnR{display:none}
#tiltBox{display:none;grid-column:1/3;place-content:center;text-align:center;color:var(--dim);font-size:13px;gap:10px;border:2px dashed var(--line);border-radius:22px}
body[data-mode=tilt] #tiltBox{display:grid}
#wheel{width:120px;height:120px;border-radius:50%;border:10px solid var(--pc);position:relative;margin:0 auto}
#wheel:after{content:'';position:absolute;left:50%;top:-4px;width:10px;height:34px;margin-left:-5px;background:var(--pc);border-radius:4px}
.right{grid-template-rows:1fr 1.5fr;grid-template-columns:1fr auto}
#btnItem{grid-column:1/2}#btnItem.has{border-color:var(--acc2)}#itemName{font-size:13px;color:var(--acc2);font-weight:700;text-align:center;display:block;margin-top:4px}
#btnReset{grid-row:1/3;grid-column:2;width:64px;font-size:22px;padding:0 4px}#btnReset small{font-size:10px;letter-spacing:0}
#btnDrift{grid-column:1/2;font-size:34px}
#tiltHint{position:absolute;inset:auto 0 0 0;font:inherit;font-size:13px;padding:8px;border-radius:10px;border:0;background:var(--acc2);color:#000}
#rot{position:fixed;inset:0;background:var(--bg);display:none;place-content:center;text-align:center;font-size:20px;padding:30px;gap:12px;z-index:9}
@media (orientation:portrait){body.playing #rot{display:grid}}
</style></head><body data-mode="tilt">
<section id="join">
  <h1>KIEZ<span>KART</span></h1>
  <div><label for="name">Dein Name</label><input id="name" maxlength="20" placeholder="z. B. Rosa" autocomplete="nickname"></div>
  <div><label for="code">Spiel-Code</label><input id="code" maxlength="20" placeholder="steht im Menü am Bildschirm" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
  <button id="go" type="button">Verbinden</button>
  <div id="msg"></div>
</section>
<section id="pad" hidden>
  <div class="bar"><span id="place"></span><b id="who"></b><span id="lap"></span><span class="sp"></span><span id="status"></span><button id="modeBtn" type="button">Lenken: Neigen</button><button id="btnStart" type="button">Start / Pause</button></div>
  <div class="left">
    <div class="btn" id="btnL">◀</div><div class="btn" id="btnR">▶</div>
    <div id="tiltBox"><div id="wheel"></div><div>Handy quer halten und wie ein Lenkrad drehen</div><button id="tiltHint" type="button" hidden>Bewegungssensor erlauben</button></div>
  </div>
  <div class="right">
    <div class="btn" id="btnItem">ITEM<small>tippen: werfen · halten: selbst</small><span id="itemName"></span></div>
    <div class="btn" id="btnReset">R<small>zurück</small></div>
    <div class="btn" id="btnDrift">DRIFT<small>halten, zum Turbo loslassen</small></div>
  </div>
</section>
<div id="rot"><div style="font-size:54px">↻</div><div>Handy quer halten</div></div>
